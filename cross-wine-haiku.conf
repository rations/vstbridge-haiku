# Meson cross file for building the Winelib host application on Haiku.
#
# Differences from `cross-wine.conf` (which targets Debian/Ubuntu):
#
#   * Haiku's Wine package installs the tools under their plain names in
#     /boot/system/bin. There is no `-stable` suffix (that is Debian's
#     wine-stable packaging convention).
#   * No [host_machine] section, matching `cross-wine.conf`. The Winelib
#     binaries produced here are still native Haiku ELF executables that happen
#     to link against Wine's Win32 implementation, so the host machine really is
#     the build machine. Declaring a distinct host machine would send Meson
#     looking for cross pkg-config files that do not exist.

[binaries]
c = 'winegcc'
cpp = 'wineg++'
ar = 'ar'
strip = 'strip'
pkgconfig = 'pkg-config'
cmake = 'cmake'

[properties]
needs_exe_wrapper = true

[built-in options]
# As in `cross-wine.conf`, the target architecture is selected in meson.build
# via -m64/-m32 rather than here, so that the 64-bit host and the 32-bit bit
# bridge can be built from a single build directory.
# https://github.com/mesonbuild/meson/issues/5125
#
# `winegcc`/`wineg++` pass the Wine headers and libraries through `-isystem` and
# `-L`, but those paths are baked in when Wine itself is built and point inside
# that exact package version's directory, revision included -- for example
# `/packages/wine-11.8-1/.self/lib`. Rebuilding the Wine package with a bumped
# revision leaves every one of them dangling, and the build then fails on a
# missing `windows.h` while compiling and on missing `-lole32`/`-lshell32`/
# `-luuid` while linking. The merged system view under `/boot/system` holds the
# same headers and import libraries without the revision in its path, so passing
# those explicitly keeps the build working across Wine package rebuilds. The
# dangling entries winegcc still adds are simply skipped.
#
# NOTE: Meson only reads these from the cross file when a build directory is
#       first set up. Editing them afterwards needs `meson configure` on the
#       existing build directory, or a `--wipe`; `--reconfigure` keeps the
#       values that were stored at setup time.
c_args = ['-isystem/boot/system/develop/headers/wine/windows', '-idirafter/boot/system/develop/headers']
cpp_args = ['-isystem/boot/system/develop/headers/wine/windows', '-idirafter/boot/system/develop/headers']
cpp_link_args = ['-mwindows', '-L/boot/system/lib', '-L/boot/system/lib/wine/x86_64-unix']
